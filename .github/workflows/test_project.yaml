name: Test Project

on:  # yamllint disable-line rule:truthy

  # presubmit
  pull_request:
    branches:
      - main

  # continuous
  schedule:
    - cron: '20 10 * * *'  # Every day at 10:20 UTC.

  # manual
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  test-tools:
    name: Test Tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.15.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ github.job }}
        repository-cache: true

    - name: Test Bazel dependencies
      run: |
        bazelisk mod deps --lockfile_mode=error

    - name: Test Python dependencies
      run: |
        bazelisk test //tools/requirements:*

    - name: Test examples
      run: |
        cd "examples"
        if ! bazelisk test --test_output=errors //... 2>&1 | tee /tmp/test_examples.log; then
          echo "### Test examples failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 /tmp/test_examples.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        set +e
        if ! bazelisk run //program -- --helpshort 2>&1 | tee /tmp/run_program.log; then
          rc=$?
          if [[ $rc -ne 1 ]]; then
            echo "### Run program failed with code $rc" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 200 /tmp/run_program.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $rc
          fi
        fi
        set -e

  test-project:
    name: Test PY ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4.2.2

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.15.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ github.job }}-${{ matrix.python-version }}
        repository-cache: true

    - name: Setup Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Test project
      run: |
        bazelisk test //federated_language/... \
            --@rules_python//python/config_settings:python_version="${{ matrix.python-version }}"
